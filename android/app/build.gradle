plugins {
    id "com.android.application"
}

def releaseStore = providers.environmentVariable("COMMANDTRAY_ANDROID_KEYSTORE").orNull
def releaseStorePassword = providers.environmentVariable("COMMANDTRAY_ANDROID_STORE_PASSWORD").orNull
def releaseAlias = providers.environmentVariable("COMMANDTRAY_ANDROID_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("COMMANDTRAY_ANDROID_KEY_PASSWORD").orNull
def signRelease = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it }

android {
    namespace "dev.commandtray.android"
    compileSdk 36

    defaultConfig {
        applicationId "dev.commandtray.android"
        minSdk 29
        targetSdk 36
        versionCode = providers.gradleProperty("commandTrayVersionCode").orElse("1").get().toInteger()
        versionName = providers.gradleProperty("commandTrayVersionName").orElse("1.0.0").get()
    }

    signingConfigs {
        if (signRelease) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signRelease) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
