services:
  relay:
    image: ${COMMANDTRAY_RELAY_IMAGE:-commandtray-relay:local}
    environment:
      COMMANDTRAY_PAIRING_CODE: ${COMMANDTRAY_PAIRING_CODE:?Set COMMANDTRAY_PAIRING_CODE in .env}
      COMMANDTRAY_RELAY_WEB: ${COMMANDTRAY_RELAY_WEB:-false}
    ports:
      - "${COMMANDTRAY_RELAY_BIND:-127.0.0.1}:${COMMANDTRAY_RELAY_PORT:-58630}:8080"
    volumes:
      - relay-data:/data
    restart: unless-stopped
    init: true
volumes:
  relay-data:
